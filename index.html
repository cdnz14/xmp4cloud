<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Leona Khanza Part 1">
<title>Leona Khanza Part 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #141829 50%, #1a1f3a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #ffffff;
    padding: 20px;
  }

  .container {
    max-width: 500px;
    width: 100%;
    background: rgba(21, 29, 53, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 255, 135, 0.15);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #00ff87, #0077ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .video-container {
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }

  video { width: 100%; height: auto; display: block; }
  .thumbnail { width: 100%; border-radius: 12px; margin-bottom: 20px; }

  .countdown {
    font-size: 16px;
    color: #00ff87;
    margin: 15px 0;
    font-weight: 600;
  }

  .button {
    display: inline-block;
    padding: 12px 28px;
    background: linear-gradient(90deg, #00ff87, #0077ff);
    color: #0a0e27;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0, 255, 135, 0.3);
    text-transform: uppercase;
    width: 100%;
    margin-top: 10px;
  }

  .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(0, 255, 135, 0.4);
  }

  .info-text {
    font-size: 13px;
    color: #c9d3e1;
    margin-top: 15px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1 class="title">📺 Leona Khanza Part 1</h1>

          
      <div class="video-container">
                  <video width="100%" height="auto" controls autoplay muted playsinline>
            <source src="https://cdn4.cloud//video/u0846vkd.mp4.mp4" type="video/mp4">
          </video>
              </div>

      <div class="countdown">
        Redirect dalam <span id="countdown">5</span> detik...
      </div>

      <button class="button" onclick="redirect()">Folder Lainnya</button>

      <div class="info-text">Video sedang diputar, tunggu dalam 5 detik...</div>

      <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');

        setInterval(() => {
          timeLeft--;
          countdownEl.textContent = timeLeft;
          if (timeLeft <= 0) {
            redirect();
          }
        }, 1000);

        function redirect() {
          window.location.href = 'https://s.shopee.co.id/2BEg1GGfei?utm_source=direct';
        }
      </script>

      </div>
</body>
</html>
